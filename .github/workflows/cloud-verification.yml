name: Cloud verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:cloud -- fast
      - name: Fetch exact accepted C1 source
        run: git fetch origin 68aa168f764531697ef34c472f87468ad738e36a --depth=1
      - name: Offline deployment readiness
        run: npm run verify:cloud -- deployment
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Install pinned browser tooling
        run: npm ci --prefix tools/browser --ignore-scripts --no-audit --no-fund
      - name: Install matching Chromium and system libraries
        run: node tools/browser/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Run localhost showcase checks
        env:
          SHOWCASE_ARTIFACTS: artifacts/showcase
        run: npm run verify:cloud -- browser
      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: showcase-failure
          path: artifacts/showcase
          if-no-files-found: ignore
          retention-days: 7
