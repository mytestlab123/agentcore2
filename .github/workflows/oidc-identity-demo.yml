name: OIDC identity demo

on:
  workflow_dispatch:
    inputs:
      confirm_identity_only:
        description: 'Run only the reviewed AWS identity demo (no deployment)'
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: oidc-identity-demo
  cancel-in-progress: false

jobs:
  identity:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_identity_only &&
      github.repository == 'mytestlab123/agentcore2' &&
      github.repository_owner_id == '58461665' &&
      github.repository_id == '1365387673' &&
      github.ref == 'refs/heads/demo/github-aws-oidc'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      DEMO_AWS_ACCOUNT_ID: ${{ secrets.DEMO_AWS_ACCOUNT_ID }}
      DEMO_AWS_ROLE_ARN: ${{ secrets.DEMO_AWS_ROLE_ARN }}
      DEMO_AWS_REGION: ${{ vars.DEMO_AWS_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_PAGER: ''
    steps:
      - name: Fail closed before authentication
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'mytestlab123/agentcore2' ]]
          [[ "$GITHUB_REPOSITORY_OWNER_ID" == '58461665' ]]
          [[ "$GITHUB_REPOSITORY_ID" == '1365387673' ]]
          [[ "$GITHUB_REF" == 'refs/heads/demo/github-aws-oidc' ]]
          [[ "$DEMO_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$DEMO_AWS_ACCOUNT_ID" != '000000000000' ]]
          [[ "$DEMO_AWS_ROLE_ARN" == "arn:aws:iam::${DEMO_AWS_ACCOUNT_ID}:role/agentcore2-github-oidc-demo" ]]
          [[ "$DEMO_AWS_REGION" == 'ap-southeast-1' ]]
          command -v aws >/dev/null
          command -v python3 >/dev/null
          echo "::add-mask::$DEMO_AWS_ACCOUNT_ID"
          echo "::add-mask::$DEMO_AWS_ROLE_ARN"
          echo 'Preflight passed; identity-only authentication is next.'

      - name: Exchange GitHub OIDC for a short-lived role session
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEMO_AWS_ROLE_ARN }}
          aws-region: ${{ vars.DEMO_AWS_REGION }}
          audience: sts.amazonaws.com
          allowed-account-ids: ${{ secrets.DEMO_AWS_ACCOUNT_ID }}
          role-session-name: oidc-demo-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          mask-aws-account-id: true
          unset-current-credentials: true
          translate-env-variables: false
          output-credentials: false
          output-env-credentials: true
          use-existing-credentials: false
          force-skip-oidc: false
          role-chaining: false
          disable-retry: true
          action-timeout-s: 60
          # Defense in depth: the session cannot call other AWS APIs even if the
          # role later acquires a policy. GetCallerIdentity requires no permission.
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Deny","Action":"*","Resource":"*"}]}

      - name: Verify identity without publishing account details
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          identity_file="$(mktemp "$RUNNER_TEMP/oidc-demo-identity.XXXXXX")"
          trap 'rm -f "$identity_file"' EXIT
          aws sts get-caller-identity --output json --no-cli-pager > "$identity_file"
          python3 - "$identity_file" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          identity = json.loads(Path(sys.argv[1]).read_text())
          session = f"oidc-demo-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          expected_arn = (
              f"arn:aws:sts::{os.environ['DEMO_AWS_ACCOUNT_ID']}:"
              f"assumed-role/agentcore2-github-oidc-demo/{session}"
          )
          if identity.get('Account') != os.environ['DEMO_AWS_ACCOUNT_ID']:
              raise SystemExit('FAIL: unexpected AWS account (details withheld)')
          if identity.get('Arn') != expected_arn:
              raise SystemExit('FAIL: unexpected role/session (details withheld)')
          result = (
              'IDENTITY_PROOF=PASS\n'
              f"Revision: {os.environ['GITHUB_SHA']}\n"
              'Expected account and dedicated role session matched.\n'
              'This proves short-lived identity only; no deployment was performed.\n'
          )
          print(result, end='')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(result)
          PY
